<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enterprise AI Agent</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <div class="chat-container">
        <header class="chat-header">
            <div class="agent-info">
                <div class="agent-avatar">
                    <i class="fa-solid fa-robot"></i>
                </div>
                <div>
                    <h2>Nexus Autonomous Agent</h2>
                    <p>Internal Database & Calculation System</p>
                </div>
            </div>
        </header>

        <main class="chat-box" id="chatBox">
            <div class="message agent-message">
                <div class="message-content">
                    Halo, saya adalah Agen AI Internal Perusahaan. Ada tugas kalkulasi atau pencarian database yang bisa saya bantu hari ini?
                </div>
            </div>
        </main>

        <footer class="chat-input-area">
            <input type="text" id="userInput" placeholder="Ketik instruksi untuk agen di sini..." autocomplete="off">
            <button id="sendBtn" onclick="sendTask()">
                <i class="fa-solid fa-paper-plane"></i>
            </button>
        </footer>
    </div>

    <script src="./app.js"></script>
</body>
</html>
